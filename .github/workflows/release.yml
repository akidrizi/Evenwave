name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: make zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Evenwave ${{ github.ref_name }}"
          files: dist/*.zip
          generate_release_notes: true
