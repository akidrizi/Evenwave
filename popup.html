<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #161d26;
    --ink-soft: #1f2833;
    --paper: #e8ebee;
    --muted: #8b98a6;
    --brand-a: #2d64ff;
    --brand-b: #8c3cf0;
    --live: #6a5cf5;
    --dead: #39434f;
    --alert: #e0a24a;
    --line: #2b3541;
  }
  * { box-sizing: border-box; }
  body {
    width: 272px;
    margin: 0;
    padding: 16px 16px 14px;
    background: var(--ink);
    color: var(--paper);
    font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .brand img { width: 26px; height: 26px; border-radius: 7px; display: block; }
  .sponsor {
    display: flex;
    align-items: center;
    padding: 4px;
    border-radius: 6px;
    color: var(--muted);
  }
  .sponsor:hover { color: #ff6b8b; background: var(--ink-soft); }
  .sponsor:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .sponsor svg { display: block; }

  /* "SUPPORT" pulls out from behind the heart like a train leaving a tunnel:
     the box clips at the heart's edge, each letter is a car, and the small
     per-letter delay is the slack in the couplings. */
  .sup {
    margin-left: auto;
    margin-right: -4px; /* tuck the tunnel mouth up against the heart */
    display: flex;
    overflow: hidden;
    pointer-events: none;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .14em;
    color: #ff6b8b;
  }
  .sup span {
    display: inline-block;
    opacity: 0;
    transform: translateX(64px);
    transition: transform .45s cubic-bezier(.25, 1.35, .5, 1), opacity .15s linear;
  }
  .brand:has(.sponsor:hover, .sponsor:focus-visible) .sup span { opacity: 1; transform: none; }
  .sup span:nth-child(2) { transition-delay: 25ms; }
  .sup span:nth-child(3) { transition-delay: 50ms; }
  .sup span:nth-child(4) { transition-delay: 75ms; }
  .sup span:nth-child(5) { transition-delay: 100ms; }
  .sup span:nth-child(6) { transition-delay: 125ms; }
  .sup span:nth-child(7) { transition-delay: 150ms; }

  /* Heartbeat: two quick beats, one slow, repeat. */
  @keyframes beat {
    0%   { transform: scale(1); }
    9%   { transform: scale(1.28); }
    18%  { transform: scale(1); }
    27%  { transform: scale(1.28); }
    36%  { transform: scale(1); }
    60%  { transform: scale(1.2); }
    84%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
  .sponsor:hover svg,
  .sponsor:focus-visible svg { animation: beat 1.5s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .sup span { transition: none; }
    .sponsor:hover svg,
    .sponsor:focus-visible svg { animation: none; }
  }
  .brand .word {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.01em;
    background: linear-gradient(90deg, var(--brand-a), var(--brand-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 {
    margin: 0 0 14px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--muted);
  }
  .meter { display: grid; gap: 7px; margin-bottom: 13px; }
  .row { display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 9px; }
  .row span { color: var(--muted); font-size: 12px; }
  .track { height: 9px; border-radius: 5px; background: var(--dead); overflow: hidden; }
  .fill {
    height: 100%;
    width: 0;
    background: var(--live);
    border-radius: 5px;
    transition: width .12s linear;
  }
  .row.silent .fill { background: var(--alert); }
  #verdict {
    margin: 0 0 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    min-height: 38px;
  }
  #verdict b { color: var(--alert); font-weight: 600; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 7px; }
  .forced { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  button {
    appearance: none;
    padding: 7px 4px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--ink-soft);
    color: var(--paper);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: #3d4a59; }
  button[aria-pressed="true"] {
    background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }
  button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  button.suggest {
    border-color: var(--live);
    box-shadow: 0 0 0 1px var(--live), 0 0 12px rgba(106, 92, 245, .35);
  }
  button:disabled,
  button:disabled:hover {
    opacity: .35;
    border-color: var(--line);
    cursor: not-allowed;
  }
  #warn {
    display: none;
    align-items: center;
    gap: 7px;
    margin: 12px 0 0;
    padding-top: 11px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--alert);
  }
  #warn.show { display: flex; }
  #warn svg { flex: none; display: block; }
  #warn.show + #site { margin-top: 8px; padding-top: 0; border-top: 0; }
  #site {
    display: none;
    margin-top: 12px;
    padding-top: 11px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  #site.show { display: block; }
  #site button {
    width: 100%;
    margin-top: 7px;
    padding: 6px 4px;
  }
  #siteHost { color: var(--paper); }
</style>
</head>
<body>
  <div class="brand">
    <img src="icons/icon48.png" alt="">
    <span class="word">Evenwave</span>
    <span class="sup" aria-hidden="true"><span>S</span><span>U</span><span>P</span><span>P</span><span>O</span><span>R</span><span>T</span></span>
    <a class="sponsor" href="https://ko-fi.com/akidrizi" target="_blank" rel="noreferrer"
       title="Support Evenwave" aria-label="Support Evenwave">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M7.655 14.916 8 14.25l.345.666a.752.752 0 0 1-.69 0Zm0 0L8 14.25l.345.666.002-.001.006-.003.018-.01a7.643 7.643 0 0 0 .31-.17 22.08 22.08 0 0 0 3.433-2.414C13.956 10.731 16 8.35 16 5.5 16 2.836 13.914 1 11.75 1 10.203 1 8.847 1.802 8 3.02 7.153 1.802 5.797 1 4.25 1 2.086 1 0 2.836 0 5.5c0 2.85 2.045 5.231 3.885 6.818a22.075 22.075 0 0 0 3.744 2.584l.018.01.006.003h.002Z"/>
      </svg>
    </a>
  </div>
  <h1>Channel levels</h1>

  <div class="meter">
    <div class="row" id="rowL"><span>Left</span><div class="track"><div class="fill" id="fillL"></div></div></div>
    <div class="row" id="rowR"><span>Right</span><div class="track"><div class="fill" id="fillR"></div></div></div>
  </div>

  <p id="verdict">Checking this tab…</p>

  <div class="modes">
    <button data-mode="auto">Automatic</button>
    <button data-mode="mono">Mono</button>
    <button data-mode="off">Off</button>
  </div>
  <div class="forced">
    <button data-mode="left">Use left channel</button>
    <button data-mode="right">Use right channel</button>
  </div>

  <p id="warn" role="status">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/>
    </svg>
    <span id="warnText"></span>
  </p>
  <div id="site">
    <span id="siteText"></span>
    <button id="siteBtn"></button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
